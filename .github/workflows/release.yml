name: Release

# Si avvia quando crei un tag di versione, ad esempio:  git tag v2.0.0 && git push origin v2.0.0
# (oppure a mano dalla scheda Actions per provare la compilazione senza pubblicare nulla)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache di Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Imposta il numero di versione dal tag
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $toml = Get-Content src-tauri/Cargo.toml -Raw
            $toml = [regex]::Replace($toml, '(?m)^version = "[^"]*"', "version = `"$v`"", 1)
            Set-Content src-tauri/Cargo.toml $toml -NoNewline -Encoding utf8
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compila il programma (Rust + Tauri)
        run: ./build.ps1

      - name: Installa Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Crea l'installer
        run: ./installer/build-installer.ps1 -Version $env:VERSION -SkipBuild

      - name: Crea la versione portatile (zip)
        run: Compress-Archive -Path dist/SpotifyOrbit.exe -DestinationPath "SpotifyOrbit-portable-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyOrbit-${{ env.VERSION }}
          path: |
            dist-installer/*.exe
            SpotifyOrbit-portable-*.zip

      - name: Pubblica la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist-installer/*.exe).FullName (Get-ChildItem SpotifyOrbit-portable-*.zip).FullName --title "Spotify Orbit $env:VERSION" --generate-notes
