name: Release

# Si avvia quando crei un tag di versione, ad esempio:  git tag v1.0.0 && git push origin v1.0.0
# (oppure a mano dalla scheda Actions per provare la compilazione senza pubblicare nulla)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installa le dipendenze
        run: python -m pip install -r requirements.txt

      - name: Imposta il numero di versione dal tag
        if: github.ref_type == 'tag'
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          "__version__ = `"$v`"" | Out-File -FilePath src/appversion.py -Encoding ascii

      - name: Compila il programma
        run: ./build.ps1

      - name: Installa Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Crea l'installer
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          ./installer/build-installer.ps1 -Version $v -SkipBuild
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Crea la versione portatile (zip)
        run: Compress-Archive -Path dist/SpotifyOrbit -DestinationPath "SpotifyOrbit-portable-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyOrbit-${{ env.VERSION }}
          path: |
            dist-installer/*.exe
            SpotifyOrbit-portable-*.zip

      - name: Pubblica la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist-installer/*.exe).FullName (Get-ChildItem SpotifyOrbit-portable-*.zip).FullName --title "Spotify Orbit $env:VERSION" --generate-notes
