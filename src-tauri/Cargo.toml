[package]
name = "spotify-orbit"
version = "2.6.0"
description = "Sfondo animato per Windows che reagisce alla musica"
edition = "2021"
publish = false

[[bin]]
name = "SpotifyOrbit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
# HTTPS con il TLS di Windows (SChannel): niente rustls e certificati radice dentro all'exe; niente gzip (non serve)
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
winreg = "0.52"
open = "5"
# stesse versioni usate da Tauri: servono per dire a WebView2 di liberare memoria quando lo sfondo è coperto
webview2-com = "0.39"
windows-core = "0.62"

[dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"     # ottimizzato per le dimensioni: il motore usa meno dell'1% di CPU, la velocità in più non serve
lto = true
codegen-units = 1
strip = true
