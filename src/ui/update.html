<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Spotify Orbit — Aggiornamento</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #eee; user-select: none;
    background: radial-gradient(ellipse at 30% 0%, #3a1c6e 0%, #14101f 55%, #0b0a12 100%);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  .card { width: 100%; max-width: 440px; }
  .icon { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 18px; box-shadow: 0 8px 28px rgba(150, 80, 255, .4); }
  h1 { font-size: 1.45rem; font-weight: 650; letter-spacing: .01em; margin-bottom: 8px; }
  .ver { opacity: .75; line-height: 1.5; margin-bottom: 16px; }
  .ver b { color: #fff; font-weight: 650; }
  .notes { max-height: 120px; overflow: auto; font-size: .82rem; line-height: 1.5; padding: 10px 12px; margin-bottom: 14px; white-space: pre-wrap;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; opacity: .85; user-select: text; }
  .hint { font-size: .8rem; opacity: .55; line-height: 1.5; margin-bottom: 18px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; }
  button { font: inherit; color: #fff; cursor: pointer; padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.09); transition: background .2s; }
  button:hover { background: rgba(255,255,255,.18); }
  button.go { background: #8a4bff; border-color: #a77bff; font-weight: 600; }
  button.go:hover { background: #9d68ff; }
  .skip { margin-top: 14px; background: none; border: 0; padding: 4px 0; font-size: .8rem; opacity: .5; text-decoration: underline; }
  .skip:hover { background: none; opacity: .85; }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="icon.png" alt="">
    <h1>Aggiornamento disponibile</h1>
    <div class="ver" id="ver">Controllo…</div>
    <div class="notes" id="notes" hidden></div>
    <div class="hint">Si apre la pagina della nuova versione su GitHub: scarica l'installer («Setup») ed eseguilo. Chiude Spotify Orbit, si aggiorna da solo e tiene le tue impostazioni.</div>
    <div class="btns">
      <button class="go" id="go">Scarica l'aggiornamento</button>
      <button id="later">Più tardi</button>
    </div>
    <button class="skip" id="skip">Salta questa versione</button>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const post = (p) => fetch(p, { method: 'POST' }).catch(() => {});
  const bye = () => { window.close(); setTimeout(() => { document.body.innerHTML = '<p style="opacity:.6">Puoi chiudere questa finestra.</p>'; }, 300); };
  fetch('/api/update').then((r) => r.json()).then((d) => {
    const v = $('ver');
    if (!d.available) { v.textContent = 'Spotify Orbit è aggiornato (versione ' + d.current + ').'; $('go').hidden = $('skip').hidden = true; return; }
    v.innerHTML = '';
    v.append('Hai la versione ', Object.assign(document.createElement('b'), { textContent: d.current }), ', è uscita la ', Object.assign(document.createElement('b'), { textContent: d.latest }), '.');
    if (d.notes && d.notes.trim()) { $('notes').textContent = d.notes.trim(); $('notes').hidden = false; }
  }).catch(() => { $('ver').textContent = 'Non riesco a leggere le informazioni sull\'aggiornamento.'; });
  $('go').onclick = () => { post('/api/update/open'); setTimeout(bye, 400); };
  $('later').onclick = bye;
  $('skip').onclick = () => { post('/api/update/skip'); setTimeout(bye, 300); };
</script>
</body>
</html>
